<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreria – Team</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2759">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Libreria">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Stile ripreso dal Know How Libreria: stessi colori, caratteri, schede, menu laterale.
   I colori si cambiano da Impostazioni → Colori (la scelta vale anche per il Know How). */
/* ---------- 1. COLORI (identici al Know How, chiaro e scuro) ---------- */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#17202E; --muted:#576377; --line:#D9DFE7; --soft:#E9EEF4;
  --accent:#B3261E; --accent-ink:#FFFFFF;
  --warn-bg:#FFF1D6; --warn-ink:#5C3B00; --warn-line:#E0A21B;
  --draft:#7A4B00; --draft-bg:#FFE7B8;
  --title:var(--ink); --head:var(--surface); --head-ink:var(--ink); --head-bar:1px solid var(--line);
  --orange:var(--accent); --stripe:var(--line); --hot-bg:var(--accent); --hot-ink:var(--accent-ink); --bk2:var(--muted);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --late:#B3261E; --ok:#2E7D32; --dn:#B3261E;
  /* nomi usati dal codice dello scadenziario */
  --card:var(--surface); --tx:var(--ink); --mu:var(--muted); --ln:var(--line); --ac:var(--accent); --onac:var(--accent-ink);
  --navh:calc(62px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --surface:#182029; --ink:#E8ECF2; --muted:#9AA6B8; --line:#2B3544; --soft:#212A37;
  --accent:#FF7A6E; --accent-ink:#1A0B09;
  --warn-bg:#33270E; --warn-ink:#F5D68A; --warn-line:#A87A12; --draft:#F5D68A; --draft-bg:#3A2D10; color-scheme:dark;
  --late:#FF7A6E; --ok:#7BC08A; --dn:#FF7A6E}}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#182029; --ink:#E8ECF2; --muted:#9AA6B8; --line:#2B3544; --soft:#212A37;
  --accent:#FF7A6E; --accent-ink:#1A0B09;
  --warn-bg:#33270E; --warn-ink:#F5D68A; --warn-line:#A87A12; --draft:#F5D68A; --draft-bg:#3A2D10; color-scheme:dark;
  --late:#FF7A6E; --ok:#7BC08A; --dn:#FF7A6E}

/* ---------- 2. BASE: pagina, intestazione, campi, bottoni, titoli ---------- */
*{box-sizing:border-box}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--navh) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
#main,.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:var(--head-bar)}
.bar{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--head-ink);text-decoration:none;white-space:nowrap;min-width:0}
.logo svg{flex:none}
.logo span{overflow:hidden;text-overflow:ellipsis}
.hme{margin-left:auto;flex:none;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px}
button:disabled{opacity:.5;cursor:default}
button.p,button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.s{font-weight:600}
button.x{background:transparent;border-color:transparent;color:var(--accent);min-height:34px;padding:4px 8px;font-size:15px}
button.s.d,button.x.d{color:var(--dn);border-color:var(--dn)}
button.x.d{border-color:transparent}
button.p.d{background:var(--dn);border-color:var(--dn);color:#fff}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0;color:var(--title)}
h1{font-size:28px;margin:22px 0 6px}
h2{font-size:21px;margin:26px 0 10px}
h2.late{color:var(--late)}
h3{font-size:18px;margin:20px 0 6px}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lead{color:var(--muted);margin:0 0 14px}
.m{color:var(--muted);font-size:15px}
.empty{color:var(--muted);font-style:italic;font-size:15px}
.late{color:var(--late)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

/* ---------- 3. SCHEDE (compiti, turni, eventi, note…) ---------- */
.card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.card .b{flex:1;min-width:0;overflow-wrap:anywhere}
.card .t{font-weight:700}
.card .m{margin-top:2px;white-space:pre-line}
.card.lt{border-left:6px solid var(--late)}
.card.ag{border-left:6px solid var(--warn-line)}
.card.done{opacity:.6}
.card.done .t{text-decoration:line-through}
.card .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.nc{cursor:pointer}.nc:not(.open) .acts{display:none}
.clamp{display:-webkit-box!important;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.clamp.open,.nc.open .clamp{display:block!important;-webkit-line-clamp:unset;overflow:visible}
.nc .t{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.nc.open .t{display:block;overflow:visible}
.pill{display:inline-block;font-size:13px;font-weight:400;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle}
.lateb{display:inline-block;background:var(--late);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-bottom:4px}
.log{font-size:15px;color:var(--ok);margin-top:4px}
.chk{width:26px;height:26px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.drow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 0}.drow .m{flex:1}
.draftn{font-size:14px;color:var(--draft);background:var(--draft-bg);border-radius:8px;padding:4px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}

/* ---------- 4. GRUPPI APRIBILI (come nel Know How) ---------- */
#main details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--surface)}
#main details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--title)}
#main details>summary::-webkit-details-marker{display:none}
#main details>summary::after{content:'+';font-size:1.4rem;line-height:1;margin-left:auto;padding-left:10px;color:var(--orange);font-weight:700}
#main details[open]>summary::after{content:'−'}
#main details[open]{border-color:var(--accent)}
#main details>.card,#main details>form,#main details>.nv{margin:0 12px 8px}
#main details>div:not(.card){margin:0 12px 10px}
#main details>details{margin:0 12px 10px}
#main details.sec.late{border-left:6px solid var(--late)}
#main details.sec.late>summary{color:var(--late)}
/* dettagli dentro una scheda (storico, andamento): più leggeri */
#main .card details{border:0;border-radius:0;margin:6px 0 0;background:transparent}
#main .card details>summary{padding:4px 0;font-family:var(--body);font-weight:600;font-size:15px;color:var(--accent);justify-content:flex-start}
#main .card details>summary::after{font-size:1.1rem;margin-left:6px}
#main .card details>div:not(.card),#main .card details>.drow{margin:0}

/* ---------- 5. MODULI, FILTRI, SETTIMANA, CALENDARIO ---------- */
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin:10px 0}
label.m,div.m{display:block}
form label.m{font-weight:600;color:var(--ink);font-size:15px}
.dys{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dy{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:15px;font-weight:400;color:var(--ink)}
.dy input{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:20px;min-width:52px;min-height:36px;padding:6px 14px;font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.wk{display:flex;gap:4px;align-items:center;margin:14px 0 6px}
.chip.day{flex:1;min-width:0;padding:6px 2px;text-align:center;line-height:1.2;border-radius:10px}
.chip.day.today:not(.on){box-shadow:inset 0 -3px 0 var(--orange)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{border:1px solid var(--line);border-radius:8px;min-height:46px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:2px}
.cell.on{outline:2px solid var(--accent)}.cell b{display:block;color:var(--ok);font-size:12px}

/* ---------- 6. IMPOSTAZIONI ---------- */
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px 14px;margin:12px 0}
.set h2{margin:14px 0 4px;font-size:21px;display:flex;align-items:center;gap:10px}
.set h2 .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--hot-bg);color:var(--hot-ink);display:flex;align-items:center;justify-content:center}
.set h2 .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set .sub{color:var(--muted);font-size:15px;margin:0 0 6px}
.opt{border-top:1px solid var(--line);padding:12px 0}.opt:last-child{padding-bottom:2px}
.opt .l{font-weight:700}.opt .h,.h{color:var(--muted);font-size:14px;margin:2px 0 8px}
.opt .row{flex-wrap:wrap}.opt .row>button{flex:1 1 auto}
.member{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.member .n{flex:1 1 100%;min-width:0;font-weight:700}.member .n small{display:block;color:var(--muted);font-weight:400}
.member select{flex:1}.member button.s{flex:none;width:auto;min-height:38px;padding:4px 12px}
.drop{border:2px dashed var(--accent);border-radius:12px;padding:22px 14px;text-align:center;color:var(--ink);background:var(--soft);cursor:pointer}
.drop.over{background:var(--hot-bg);color:var(--hot-ink)}.drop b{display:block}.drop span{color:var(--muted);font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.pc{display:block;padding:0;overflow:hidden;text-align:left;border-radius:12px;min-height:0;background:var(--surface)}
.pc .pv{display:flex;height:34px}.pc .pv i{flex:1}.pc .pv i:first-child{flex:2}
.pc .pt{display:block;padding:8px 10px 10px}.pc .pt b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}.pc .pt small{display:block;color:var(--muted);font-size:13px;line-height:1.25;margin-top:2px}
.pc.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.crow input[type=color]{width:60px;height:42px;padding:2px;flex:none}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.agrid button{font-size:24px;padding:6px 0}.agrid button.on{outline:2px solid var(--accent)}
.cgrid{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.cgrid button{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}.cgrid button.on{border-color:var(--ink)}

/* ---------- 7. AVATAR E NOVITÀ ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;overflow:hidden;vertical-align:middle;color:#fff;font-weight:700;font-family:var(--body);line-height:1}
.av img{width:100%;height:100%;object-fit:cover}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.nv{padding:9px 0;font-size:15px;border-top:1px solid var(--line)}.nv:first-of-type{border-top:0}.nv.new{font-weight:700}.nv small{color:var(--muted);font-weight:400}

/* ---------- 8. MENU LATERALE (identico al Know How) ---------- */
#scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45)}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(84vw,320px);overflow-y:auto;overscroll-behavior:contain;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;box-shadow:4px 0 24px rgba(0,0,0,.18);
  background:var(--dr-bg,var(--surface));color:var(--dr-ink,var(--ink));border-right:1px solid var(--dr-line,var(--line))}
#drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dtop{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px 6px;font-family:var(--display);font-size:20px;color:var(--dr-ink,var(--ink))}
.dlab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dr-mut,var(--muted));margin:14px 8px 4px}
.dl{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--dr-ink,var(--ink));font:inherit;font-size:16px;font-weight:600;text-align:left;text-decoration:none;cursor:pointer}
.dl svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dl[aria-current="page"]{background:var(--dr-sel,var(--soft));color:var(--dr-ink,var(--accent));box-shadow:inset 3px 0 0 var(--dr-hi,var(--orange))}
.dl .bdg{margin-left:auto}
.hbtn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:8px;color:var(--head-ink);background:transparent;cursor:pointer}
.hbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#drawer .hbtn{color:var(--dr-ink,var(--head-ink));border-color:var(--dr-line,var(--line))}
body.noscroll{overflow:hidden}

/* ---------- 9. BARRA IN BASSO ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
#nav .in{display:flex;width:100%;max-width:760px}
#nav button{position:relative;flex:1;min-width:0;min-height:62px;border:0;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--orange)}
#nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{display:inline-block;background:var(--late);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
#nav .bdg{position:absolute;top:6px;left:calc(50% + 6px)}

/* ---------- 10. KNOW HOW (pagina del manuale dentro l'app) ---------- */
#kh{position:fixed;left:0;right:0;top:0;bottom:var(--navh);z-index:15;background:var(--bg)}
#kh iframe{width:100%;height:100%;border:0;display:block}
#kh .msg{max-width:520px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px}
body.khmode header,body.khmode #main{display:none}
body.khmode::before{display:none}

/* ---------- 11. FINESTRE (foglio in basso, come nel Know How) ---------- */
dialog.dlg{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:760px;max-height:88vh;overflow:auto;border:0;border-top:3px solid var(--orange);border-radius:14px 14px 0 0;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
dialog.dlg .bd{padding:18px 18px 12px}dialog.dlg h3{margin:0 0 8px;font-size:21px}dialog.dlg p{margin:0 0 10px}
dialog.dlg ul{margin:6px 0 10px;padding-left:20px}dialog.dlg .m{font-size:14px}
dialog.dlg .bt{display:flex;gap:8px;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}dialog.dlg .bt>button{flex:1 1 40%}
dialog.dlg input{margin:6px 0 4px}
dialog.dlg .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}dialog.dlg .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
#toast{display:none;position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:60;font-size:15px}
#sync{bottom:calc(var(--navh) + 10px)!important}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--title);margin:2px 0 8px;overflow-wrap:anywhere}
.member .chips{flex:1 1 100%;flex-wrap:wrap;padding:0}.member .chip{min-height:34px;font-size:14px}

@media (prefers-reduced-motion:no-preference){.card,.chip{transition:border-color .12s}}
</style>
</head>
<body>
<header><div class="bar">
  <button id="menuBtn" class="hbtn" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="logo" href="#" id="logo" aria-label="Oggi"><svg viewBox="0 0 40 34" width="36" height="31" aria-hidden="true"><rect x="7" y="9" width="6" height="17" rx="1" style="fill:var(--orange)"/><rect x="7" y="13" width="6" height="1.6" fill="#fff" opacity=".45"/><rect x="15" y="4" width="7" height="22" rx="1" style="fill:var(--bk2)"/><rect x="15" y="9" width="7" height="1.6" fill="#fff" opacity=".45"/><rect x="24" y="10" width="6" height="16" rx="1" style="fill:var(--head-ink)"/><rect x="24" y="14" width="6" height="1.6" fill="#fff" opacity=".4"/><rect x="3" y="26" width="34" height="3.4" rx="1.4" style="fill:var(--head-ink)"/><rect x="6" y="29.4" width="3" height="3" style="fill:var(--head-ink)" opacity=".7"/><rect x="31" y="29.4" width="3" height="3" style="fill:var(--head-ink)" opacity=".7"/></svg><span>Libreria · Team</span></a>
  <button id="hme" class="hme" aria-label="Il tuo account"></button>
</div></header>
<main id="main"></main>
<div id="kh" hidden></div>
<div id="scrim" hidden></div>
<aside id="drawer" aria-label="Menu" inert></aside>
<nav id="nav" aria-label="Sezioni principali"></nav>
<script src="config.js"></script>

function openDrawer(){const d=document.getElementById('drawer');d.inert=false;d.classList.add('open');document.getElementById('scrim').hidden=false;document.body.classList.add('noscroll');document.getElementById('menuBtn').setAttribute('aria-expanded','true');setTimeout(()=>{const c=d.querySelector('[aria-current=page]')||d.querySelector('.dl');c&&c.focus()},50)}
function closeDrawer(){const d=document.getElementById('drawer');if(!d.classList.contains('open'))return;d.classList.remove('open');d.inert=true;document.getElementById('scrim').hidden=true;document.body.classList.remove('noscroll');const b=document.getElementById('menuBtn');b.setAttribute('aria-expanded','false');b.focus()}
document.getElementById('menuBtn').onclick=openDrawer;document.getElementById('scrim').onclick=closeDrawer;
document.getElementById('logo').onclick=e=>{e.preventDefault();go('oggi')};document.getElementById('hme').onclick=()=>go('impostazioni');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
function render(){
 REF=null;pending=false;
 const LN=db?lateList().length:0;
 drawNav(LN);drawDrawer(LN);
 document.body.classList.remove('khmode');document.getElementById('kh').hidden=true;
 let dl=document.getElementById('staffl');if(!dl){dl=el('datalist',{id:'staffl'});document.body.append(dl)}dl.replaceChildren(...staff().filter(x=>x.role!=='Area manager').map(x=>el('option',{value:x.name})));
 const m=document.getElementById('main');m.replaceChildren();
 if(!db){m.append(el('p',{class:'empty'},'Collegamento al foglio Google non disponibile.'));return}
 if(tab==='manuale'){renderKh(m);return}
 if(tab==='impostazioni'){renderSettings(m);return}
 if(tab==='oggi'){renderOggi(m);return}
 if(tab==='storico'){renderStorico(m);return}
 const s=SEC[tab];m.append(el('h1',{},s.title));
 if(!adding&&!editing&&DR[s.kind+':new'])adding={};
 const put=(i,box=m)=>box.append(editing===i.id?form(s,i):row(s,i));
 const bar=el('div',{class:'row',style:'margin:8px 0'});
 if(!adding)bar.append(el('button',{class:'p',type:'button',onclick:()=>{adding={};render()}},'+ '+NEW[tab]));
 if(tab==='compiti'&&sample&&!adding)bar.append(el('button',{class:'s',type:'button',onclick:()=>{mailOpen=!mailOpen;render()}},'✉️ Da email'));
 m.append(bar);
 if(adding)m.append(form(s,adding.draft?adding:null));
 if(mailOpen&&!review)m.append(mailBox());
 if(review)m.append(reviewBox());
 if(fixPrev)m.append(fixBox());
 if(tab==='compiti'&&xlMsg)m.append(el('div',{class:'m'},xlMsg));
 let list=items.filter(i=>i.kind===s.kind&&(!s.filter||s.filter(i))).sort(s.sort);
 if(s.kind==='task'){
  const ch=el('div',{class:'chips'});
  CF.forEach(([k,l])=>ch.append(el('button',{class:'chip'+(k===cf?' on':''),type:'button',onclick:()=>{cf=k;render()}},l)));
  m.append(ch);
  if(cf==='all'||cf==='today')lateBox(m);
  const LO=new Set(lateList().filter(x=>x.once).map(x=>x.it.id));
  const t=today(),ok={all:()=>1,today:i=>dueOn(i,t)||(['due','window','none'].includes(i.freq)&&(!i.start||i.start<=t)&&!isDone(i)),due:i=>['due','window','day'].includes(i.freq)};
  const fl=i=>cf==='grp'||(ok[cf]||(x=>x.freq===cf))(i);
  const GR=cf==='grp'?[...new Set(list.map(i=>i.grp||''))].sort((a,b)=>(!a)-(!b)||a.localeCompare(b)).map(g=>[g,g||'Senza promo']):GRP;
  let n=0;
  GR.forEach(([f,l])=>{
   const g=list.filter(i=>(cf==='grp'?(i.grp||'')===f:fgrp(i)===f)&&fl(i)&&!(LO.has(i.id)&&(cf==='all'||cf==='today')));if(!g.length)return;n++;
   const nu=g.filter(i=>!isDone(i)).length,sec=det('g'+cf+':'+f,l+' ('+(nu?nu+' da fare':'tutti fatti')+')',true,'sec');m.append(sec);
   if(f==='weekly'&&cf!=='grp'){WD.forEach(d=>{const gd=g.filter(i=>(i.days||[]).includes(d));if(!gd.length)return;REF=addD(weekKey(),(d+6)%7);const nd=gd.filter(i=>!isDone(i)).length,dd=det('w'+d,GIORNI[d]+' · '+nd+' da fare'+(gd.length-nd?', '+(gd.length-nd)+' fatti':''),d===new Date().getDay());gd.filter(i=>!isDone(i)).concat(gd.filter(isDone)).forEach(i=>put(i,dd));sec.append(dd);REF=null});g.filter(i=>!(i.days||[]).length).forEach(i=>put(i,sec))}
   else{const un=g.filter(i=>!isDone(i)),dn=g.filter(isDone);un.forEach(i=>put(i,sec));if(dn.length){const dd=det('d'+f,'✔ Fatti ('+dn.length+')',false);dn.forEach(i=>put(i,dd));sec.append(dd)}}
  });
  if(!n)m.append(el('p',{class:'empty'},'Nessun compito in questa vista.'));
  if(sample)m.append(el('button',{class:'x',type:'button',style:'margin-top:14px',onclick:e=>fixOld(e.target)},'🏷️ Sistema titoli compiti da mail'));
 }else{
  if(!list.length)m.append(el('p',{class:'empty'},'Ancora niente qui.'));
  if(s.kind==='note'){
   const q=el('input',{type:'search',placeholder:'🔍 Cerca nelle note…'});m.append(q);const L=list,wrap=el('div');
   const pins=L.filter(i=>i.pin);if(pins.length){wrap.append(el('h2',{},'Fissate'));pins.forEach(i=>put(i,wrap))}
   const ms={};L.filter(i=>!i.pin).forEach(i=>{const k=iso(new Date(i.ts)).slice(0,7);(ms[k]=ms[k]||[]).push(i)});
   Object.keys(ms).sort().reverse().forEach((k,n)=>{const dd=det('n'+k,new Date(k+'-01T00:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'})+' ('+ms[k].length+')',n===0);ms[k].forEach(i=>put(i,dd));wrap.append(dd)});
   q.oninput=()=>{const v=q.value.toLowerCase().trim();wrap.querySelectorAll('.card').forEach(c=>c.style.display=(c.dataset.s||'').includes(v)?'':'none');if(v)wrap.querySelectorAll('details').forEach(d=>d.open=true)};
   m.append(wrap);return}
  if(s.kind==='shift'){
   const t=today(),past=list.filter(x=>x.date<t),fut=list.filter(x=>x.date>=t);
   const dayBox=(d,L,open,into)=>{const nw=new Set(L.filter(x=>!x.abs).map(x=>x.who)).size,na=new Set(L.filter(x=>x.abs).map(x=>x.who)).size;
    const bx=det('t'+d,fmt(d)+(d===t?' · oggi':'')+' — '+nw+(nw===1?' persona':' persone')+' in turno'+(na?', '+na+' assenti':''),open);L.forEach(i=>put(i,bx));into.append(bx)};
   if(!fut.length&&list.length)m.append(el('p',{class:'empty'},'Nessun turno da oggi in poi.'));
   [...new Set(fut.map(x=>x.date))].forEach(d=>dayBox(d,fut.filter(x=>x.date===d),d===t,m));
   if(past.length){const pd=det('tpast','Turni passati (ultimi 60 giorni) · '+(n=>n+(n===1?' giorno':' giorni'))(new Set(past.map(x=>x.date)).size),false,'sec');[...new Set(past.map(x=>x.date))].reverse().forEach(d=>dayBox(d,past.filter(x=>x.date===d),false,pd));m.append(pd)}
   return}
  let last='';list.forEach(i=>{
   const g=s.kind==='event'?i.start.slice(0,7):'';
   if(g&&g!==last){last=g;m.append(el('div',{class:'m',style:'margin-top:10px'},new Date(i.start+'T00:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'})))}
   put(i,m)});
 }
}

function linkMe(){if(!uid)return;const L=staff(),sd=L.find(x=>x.uid===uid)||L.find(x=>x.name.toLowerCase()===uid.toLowerCase());
 if(sd){name=sd.name;if(sd.uid!==uid)upd(sd.id,{uid})}else save('s'+Date.now(),{kind:'staff',name:uid,uid,active:true,role:'Libraia',ts:Date.now()});needWho=false;renderMe()}
function renderMe(){
 const me=document.getElementById('hme');me.replaceChildren();me.hidden=!name;
 if(name){me.append(av(name,34));me.title=name+' · il tuo account'}
}
applyPf();tab=pf.start||'oggi';renderMe();render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
 try{db=await claude.use('db')}catch(e){db=null}
 try{sample=await claude.use('sample')}catch(e){sample=null}
 try{const c=sample&&await sample.limits();imgOK=!!(c&&c.images)}catch(e){}
 if(!db){render();return}
 try{usr=await claude.use('user');const me=usr&&await usr.me();uid=(me&&me.id)||''}catch(e){}
 if(uid){name=uid;needWho=false;renderMe()}
 try{const sn=await db.doc('meta/settings').get();cfg=sn.exists?sn.data():{}}catch(e){}
 try{const r=uref(),sn=r&&await r.get();if(sn&&sn.exists){const d=sn.data();if(d.pf)Object.assign(pf,d.pf);seenTs=+d.seen||0;applyPf();tab=pf.start||'oggi'}}catch(e){}
 try{if(!seenTs)seenTs=+localStorage.getItem('seen')||0}catch(e){}
 if(!seenTs){seenTs=Date.now();savePriv()}
 db.collection('items').onSnapshot(s=>{items=s.docs.map(d=>{const x={...d.data(),id:d.id};if(x.kind==='fixed'){x.kind='task';x.freq='weekly';x.log=[]}if(x.freq==='weekly'&&!x.days)x.days=x.day!=null?[x.day]:[];else if(x.kind==='due'){x.kind='task';x.freq='due';x.log=x.done?[{by:'',at:x.ts||0,p:'once',n:''}]:[]}return x});
  const ids=new Set(items.map(i=>i.id));if(known)items.filter(i=>!known.has(i.id)&&i.by&&i.by!==name&&KL[i.kind]).forEach(i=>{const tx=i.by+': '+KL[i.kind]+' — '+(i.text||i.title||i.name||i.who||'');if(pf.notif){toast('🔔 '+tx);}});known=ids;renderMe();
  if(!started){started=true;linkMe();syncCond();setTimeout(khPrefetch,4000);if(cfg.purgeDays&&localStorage.getItem('pday')!==today()){try{localStorage.setItem('pday',today())}catch(e){}purge(cfg.purgeDays)}}
  if(!seeded){seeded=true;autoSeed()}if(busy()){pending=true;return}render()},()=>{});
 render();
})();
