<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreria – Team</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2759">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Libreria">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!--
CORNICE DELL'APP — questo file resta su GitHub e non si modifica dall'app.
Si occupa di: accesso con nome e password e salvataggio nel foglio Google (backend.js),
scelta della pagina da mostrare: l'originale (app.html) oppure la versione pubblicata da Elisa,
anteprima solo sul proprio telefono, ritorno all'originale se una versione non parte.
Indirizzo di emergenza: aggiungere ?originale all'indirizzo dell'app per usare sempre app.html.
-->
<style>
:root{--bg:#F4F6F8;--surface:#FFFFFF;--ink:#17202E;--muted:#576377;--line:#D9DFE7;--soft:#E9EEF4;--accent:#0B2759;--accent-ink:#FFFFFF;--title:#0B2759;--head:#0B2759;
 --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif;--tx:var(--ink);--mu:var(--muted);--ln:var(--line);--card:var(--surface);--bar:44px}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--surface:#182029;--ink:#E8ECF2;--muted:#9AA6B8;--line:#2B3544;--soft:#212A37;--accent:#9DB0CC;--accent-ink:#0E1626;--title:#E8ECF2;--head:#050B16;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow:hidden}
/* fasce di sistema (notch e barra del telefono) con i colori dell'app */
#saTop{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--head);z-index:5}
#saBot{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:var(--surface);z-index:5}
#appf{position:fixed;left:env(safe-area-inset-left,0px);top:env(safe-area-inset-top,0px);border:0;display:block;background:var(--bg);
 width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.withbar #appf{top:calc(env(safe-area-inset-top,0px) + var(--bar));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--bar))}
#shellbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:var(--bar);z-index:6;display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));
 background:#FFF1D6;color:#5C3B00;border-bottom:1px solid #E0A21B;font-size:14px;font-weight:600}
#shellbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shellbar button{flex:none;min-height:32px;padding:2px 10px;font-size:14px;border-radius:8px;border:1px solid #B78A2A;background:#fff;color:#5C3B00;font-weight:600;cursor:pointer}
#shellbar button.p{background:#5C3B00;color:#fff;border-color:#5C3B00}
/* schermata di accesso (disegnata da backend.js) */
h1{font-family:var(--display);color:var(--title);line-height:1.2}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.x{background:transparent;border-color:transparent;color:var(--accent)}
#login{overflow:auto}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div id="saTop"></div><div id="saBot"></div>
<div id="boot">Apro l'app…</div>
<div id="shellbar" hidden></div>
<iframe id="appf" title="Libreria · Team" hidden></iframe>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
(function () {
  const frame = document.getElementById('appf'), bar = document.getElementById('shellbar');
  const BASE = new URL('.', location.href).href;
  const ORIGINALE = new URLSearchParams(location.search).has('originale');
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } };
  let running = { mode: 'original', ver: '', info: null }, watchT = null;

  /* ── avvisi della cornice (barra in alto) ── */
  function showBar(text, buttons, ttl) {
    bar.replaceChildren();
    const s = document.createElement('span'); s.textContent = text; bar.append(s);
    (buttons || []).forEach(([label, fn, cls]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (cls) b.className = cls; b.onclick = fn; bar.append(b); });
    bar.hidden = false; document.body.classList.add('withbar');
    clearTimeout(bar._t); if (ttl) bar._t = setTimeout(hideBar, ttl);
  }
  function hideBar() { bar.hidden = true; document.body.classList.remove('withbar'); }
  // backend.js usa toast() per i messaggi: li mostro dentro l'app se è aperta, altrimenti nella barra.
  window.toast = function (t) {
    try { const w = frame.contentWindow; if (w && w !== window && typeof w.toast === 'function') { w.toast(t); return; } } catch (e) { }
    showBar(String(t), [['OK', hideBar]], 6000);
  };
  // L'app comunica i suoi colori: la cornice colora le fasce del telefono allo stesso modo.
  window.shellTheme = function (c) {
    const st = document.documentElement.style;
    if (c.head) st.setProperty('--head', c.head); if (c.bg) st.setProperty('--bg', c.bg); if (c.surface) st.setProperty('--surface', c.surface);
    const mt = document.querySelector('meta[name=theme-color]'); if (mt && c.head) mt.content = c.head;
  };

  /* ── caricamento della pagina dell'app ── */
  const CATCH = '<script>window.__appErr=[];addEventListener("error",function(e){__appErr.push(e.message||"errore")});<\/script>';
  function inject(html, extra) {
    const head = '<base href="' + BASE + '">' + CATCH + (extra || '');
    return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + head) : head + html;
  }
  function show(mode, html, ver, info) {
    running = { mode, ver: ver || '', info: info || null };
    if (frame.dataset.u) URL.revokeObjectURL(frame.dataset.u);
    if (html) { const u = URL.createObjectURL(new Blob([inject(html)], { type: 'text/html' })); frame.dataset.u = u; frame.src = u; }
    else { frame.dataset.u = ''; frame.src = 'app.html'; }
    frame.hidden = false; document.getElementById('boot').hidden = true;
    clearTimeout(watchT); if (html) watchT = setTimeout(check, 6000);
  }
  // Se una versione pubblicata (o l'anteprima) non parte, torno da sola all'originale.
  function check() {
    let why = '';
    try {
      const w = frame.contentWindow, d = w.document, errs = w.__appErr || [];
      if (errs.length) why = errs[0];
      else if (((d.body && d.body.innerText) || '').trim().length < 20) why = 'la pagina resta vuota';
    } catch (e) { why = e.message; }
    if (!why) return;
    const was = running.mode;
    show('original');
    showBar((was === 'preview' ? 'L\'anteprima' : 'La versione pubblicata dell\'app') + ' non parte (' + why + '): uso quella originale.', [['Chiudi', hideBar]]);
  }
  function previewBar() {
    showBar('Anteprima: la vedi solo tu', [['Esci', () => window.appStore.endPreview()], ['Pubblica', async () => {
      const p = await teamAuth.appCache('preview'); if (!p) return;
      if (!confirm('Pubblicare questa versione per tutte?')) return;
      try { await window.appStore.publish(p.html); location.reload(); } catch (e) { alert('Pubblicazione non riuscita: ' + (e && e.message || e)); }
    }, 'p']]);
  }
  async function checkUpdate() {
    if (running.mode === 'preview' || ORIGINALE) return;
    const want = teamAuth.appVer();
    if (!want && running.mode === 'custom') { showBar('Ora è in uso la versione originale dell\'app.', [['Aggiorna', () => location.reload(), 'p']]); return; }
    if (want && want !== running.ver) {
      const r = await teamAuth.getApp();
      if (r && r.html) showBar('È pronta una nuova versione dell\'app.', [['Aggiorna', () => location.reload(), 'p']]);
    }
  }

  /* ── funzioni usate dalla sezione "App (scadenziario)" delle Impostazioni ── */
  function trial(html) {
    return new Promise(res => {
      const tc = teamAuth.readOnlyClaude(); window.__trialClaude = tc;
      const KEYS = ['pf', 'open', 'drafts', 'pday', 'seen'], keep = {}; KEYS.forEach(k => keep[k] = lsGet(k));
      const fr = document.createElement('iframe'); fr.title = 'prova'; fr.setAttribute('aria-hidden', 'true');
      fr.style.cssText = 'position:fixed;left:-9999px;top:0;width:390px;height:800px;border:0';
      const u = URL.createObjectURL(new Blob([inject(html, '<script>window.claude=parent.__trialClaude;window.teamAuth=parent.teamAuth;<\/script>')], { type: 'text/html' }));
      const done = r => { clearTimeout(to); tc.close(); fr.remove(); URL.revokeObjectURL(u); KEYS.forEach(k => lsSet(k, keep[k])); res(r); };
      const to = setTimeout(() => done({ ok: false, errs: ['La pagina non ha finito di caricarsi entro 20 secondi'] }), 20000);
      fr.onload = () => setTimeout(() => {
        try {
          const w = fr.contentWindow, d = w.document, errs = (w.__appErr || []).slice(0, 5), txt = ((d.body && d.body.innerText) || '').trim();
          done({ ok: !errs.length && txt.length >= 20 && tc.used, errs, usedDb: tc.used });
        } catch (e) { done({ ok: false, errs: [String(e && e.message || e)] }); }
      }, 3000);
      document.body.append(fr); fr.src = u;
    });
  }
  window.appStore = {
    info: () => ({ mode: running.mode, ver: running.ver, info: running.info }),
    async exportHtml() {
      if (running.mode === 'original') return await (await fetch('app.html', { cache: 'no-store' })).text();
      const c = await teamAuth.appCache(running.mode === 'preview' ? 'preview' : 'custom');
      if (!c) throw new Error('Copia della versione in uso non trovata');
      return c.html;
    },
    trial,
    async preview(html) { await teamAuth.appCachePut('preview', { html, ver: 'anteprima' }); lsSet('app-preview', '1'); location.reload(); },
    async endPreview() { lsSet('app-preview', null); await teamAuth.appCacheDel('preview'); location.reload(); },
    async publish(html) { const info = await teamAuth.putApp(html); lsSet('app-preview', null); await teamAuth.appCacheDel('preview'); return info; },
    versions: () => teamAuth.appVersions(),
    restore: vid => teamAuth.restoreApp(vid),
    original: () => teamAuth.clearApp(),
    reload: () => location.reload()
  };

  /* ── avvio ── */
  (async function boot() {
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
    const hasToken = !!lsGet('tk');
    if (ORIGINALE) {
      show('original');
      showBar('Versione originale dell\'app (indirizzo di emergenza).', [['Esci', () => location.replace(location.pathname)]]);
      return;
    }
    if (hasToken && lsGet('app-preview') === '1') {
      const p = await teamAuth.appCache('preview');
      if (p) { show('preview', p.html, 'anteprima'); previewBar(); return; }
      lsSet('app-preview', null);
    }
    if (hasToken) {
      // Parto subito con la copia salvata sul telefono, poi controllo se c'è una versione nuova.
      const want = teamAuth.appVer(), c = want ? await teamAuth.appCache('custom') : null;
      if (c) show('custom', c.html, c.ver, c.info); else show('original');
      try { await claude.use('db'); await teamAuth.refresh(); } catch (e) { }
      if (running.mode === 'original' && teamAuth.appVer() && !c) {
        // prima apertura su questo telefono dopo una pubblicazione: scarico e apro subito la versione giusta
        const r = await teamAuth.getApp(); if (r && r.html) { show('custom', r.html, r.ver, r.info); return; }
      }
      checkUpdate(); setInterval(checkUpdate, 120000);
      return;
    }
    // Primo accesso su questo telefono: prima nome e password, poi la versione giusta dell'app.
    document.getElementById('boot').hidden = true;
    try { await claude.use('db'); } catch (e) { }
    const want = teamAuth.appVer();
    if (want) { const r = await teamAuth.getApp(); if (r && r.html) { show('custom', r.html, r.ver, r.info); return; } }
    show('original');
  })();
})();
</script>
</body>
</html>
